<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSTA — Knowledge & Collaboration Platform</title>
  <meta name="description" content="Discover technical knowledge, initiatives, solutions and experts across DSTA.">

  <!-- Inter web font (declared first in --font-body / --font-display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- App mounts here. If APP_CONFIG is missing, app.js renders a full-page notice. -->
  <div id="app" aria-live="off"></div>

  <!-- Runtime config is generated at deploy time as frontend/config.js.
       It MUST load before app.js. Missing/empty config is handled gracefully. -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
