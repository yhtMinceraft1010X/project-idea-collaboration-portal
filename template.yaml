AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Digital Hub Technical Knowledge & Collaboration Platform - serverless backend
  (Cognito, API Gateway, Lambda, DynamoDB, S3 Vectors, Bedrock, Step Functions,
  SQS/SNS/EventBridge) plus a CloudFront-hosted SPA.

Parameters:
  ResourcePrefix:
    Type: String
    Default: app-193a359c-027ffd1c-
    Description: Mandatory platform naming prefix for every resource.
  PermissionsBoundaryArn:
    Type: String
    Default: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
    Description: Permissions boundary that every IAM role must attach.
  LogRetentionDays:
    Type: Number
    Default: 731
    Description: CloudWatch log retention (2 years) per audit requirements.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64
    Tracing: Active
    CodeUri: src/
    Layers:
      - !Ref DependenciesLayer
    Environment:
      Variables:
        LOG_LEVEL: INFO
        VECTOR_BUCKET: !Sub '${ResourcePrefix}vectors'
        EVENT_BUS_NAME: !Sub '${ResourcePrefix}bus-events'
        EMBED_MODEL_ID: cohere.embed-multilingual-v3
        CHAT_MODEL_ID: global.anthropic.claude-haiku-4-5-20251001-v1:0
        CHAT_MODEL_ID_HQ: global.anthropic.claude-sonnet-5
  Api:
    TracingEnabled: true

Resources:

  # ---------------------------------------------------------------------------
  # Shared dependencies layer (AWS SDK v3 clients)
  # ---------------------------------------------------------------------------
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${ResourcePrefix}deps'
      Description: AWS SDK v3 clients shared by all functions.
      ContentUri: layer/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: nodejs22.x

  # ---------------------------------------------------------------------------
  # S3 buckets
  # ---------------------------------------------------------------------------
  SpaAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ResourcePrefix}spa-assets'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  IngestionStagingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ResourcePrefix}ingestion-staging'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-staging
            Status: Enabled
            ExpirationInDays: 30

  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ResourcePrefix}assets'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DashboardSnapshotsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ResourcePrefix}dashboard-snapshots'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ---------------------------------------------------------------------------
  # CloudFront (TLS edge for the SPA)
  # ---------------------------------------------------------------------------
  SpaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ResourcePrefix}oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${ResourcePrefix}cdn'
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: spa-s3-origin
            DomainName: !GetAtt SpaAssetsBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SpaOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: spa-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  SpaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SpaAssetsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SpaAssetsBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SpaDistribution.Id}'

  # ---------------------------------------------------------------------------
  # Cognito (authentication + persona groups)
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ResourcePrefix}user-pool'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      MfaConfiguration: 'OFF'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ResourcePrefix}spa-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      CallbackURLs:
        - !Sub 'https://${SpaDistribution.DomainName}/'
        - !Sub 'https://${SpaDistribution.DomainName}/index.html'
      LogoutURLs:
        - !Sub 'https://${SpaDistribution.DomainName}/'

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${ResourcePrefix}auth'
      UserPoolId: !Ref UserPool

  LeadGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Lead
      Description: Initiative / Team Leads
      Precedence: 10
      UserPoolId: !Ref UserPool
  SmeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: SME
      Description: Subject Matter Experts
      Precedence: 20
      UserPoolId: !Ref UserPool
  ReviewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Reviewer
      Description: Content Reviewers / Moderators
      Precedence: 30
      UserPoolId: !Ref UserPool
  PortfolioGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Portfolio
      Description: Portfolio Leads / Programme Managers
      Precedence: 40
      UserPoolId: !Ref UserPool
  MgmtGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Mgmt
      Description: Senior Management / Strategy Leads
      Precedence: 50
      UserPoolId: !Ref UserPool
  OpsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Ops
      Description: Platform Operators / System Owners
      Precedence: 60
      UserPoolId: !Ref UserPool

  # ---------------------------------------------------------------------------
  # API Gateways
  # ---------------------------------------------------------------------------
  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${ResourcePrefix}api'
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn

  WebhooksApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${ResourcePrefix}webhooks-api'
      StageName: prod

  # ---------------------------------------------------------------------------
  # DynamoDB tables
  # ---------------------------------------------------------------------------
  ProblemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ResourcePrefix}problems'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - { AttributeName: status, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  InitiativesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ResourcePrefix}initiatives'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: leadUserId, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
        - { AttributeName: linkedProblemId, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: LeadIndex
          KeySchema:
            - { AttributeName: leadUserId, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: ProblemIndex
          KeySchema:
            - { AttributeName: linkedProblemId, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  SolutionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ResourcePrefix}solutions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ResourcePrefix}findings'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  AssetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ResourcePrefix}assets'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  SmeProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ResourcePrefix}sme-profiles'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  RelationshipsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ResourcePrefix}relationships'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: InvertedIndex
          KeySchema:
            - { AttributeName: sk, KeyType: HASH }
            - { AttributeName: pk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ResourcePrefix}audit-log'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ReviewQueueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ResourcePrefix}review-queue'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
        - { AttributeName: submittedAt, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - { AttributeName: status, KeyType: HASH }
            - { AttributeName: submittedAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  AnalyticsSnapshotTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ResourcePrefix}analytics-snapshot'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  OverlapResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ResourcePrefix}overlap-results'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  # ---------------------------------------------------------------------------
  # SQS queues (+ DLQs)
  # ---------------------------------------------------------------------------
  ReviewDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ResourcePrefix}q-review-dlq'
      MessageRetentionPeriod: 1209600
  ReviewQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ResourcePrefix}q-review'
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReviewDlq.Arn
        maxReceiveCount: 3

  IngestionJiraDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ResourcePrefix}q-ingestion-jira-dlq'
      MessageRetentionPeriod: 1209600
  IngestionJiraQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ResourcePrefix}q-ingestion-jira'
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionJiraDlq.Arn
        maxReceiveCount: 3

  IngestionConfluenceDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ResourcePrefix}q-ingestion-confluence-dlq'
      MessageRetentionPeriod: 1209600
  IngestionConfluenceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ResourcePrefix}q-ingestion-confluence'
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionConfluenceDlq.Arn
        maxReceiveCount: 3

  IngestionGithubDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ResourcePrefix}q-ingestion-github-dlq'
      MessageRetentionPeriod: 1209600
  IngestionGithubQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ResourcePrefix}q-ingestion-github'
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionGithubDlq.Arn
        maxReceiveCount: 3

  # ---------------------------------------------------------------------------
  # SNS topics
  # ---------------------------------------------------------------------------
  OverlapNotifyTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ResourcePrefix}topic-overlap-notify'
  SmeRoutingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ResourcePrefix}topic-sme-routing'
  OpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ResourcePrefix}topic-ops-alerts'

  # ---------------------------------------------------------------------------
  # EventBridge custom bus
  # ---------------------------------------------------------------------------
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${ResourcePrefix}bus-events'

  # ---------------------------------------------------------------------------
  # Secrets Manager + SSM parameters
  # ---------------------------------------------------------------------------
  JiraSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ResourcePrefix}secret-jira'
      Description: Jira API token + webhook shared secret
      SecretString: '{"apiToken":"REPLACE_ME","webhookSecret":"REPLACE_ME","baseUrl":""}'
  ConfluenceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ResourcePrefix}secret-confluence'
      Description: Confluence API token
      SecretString: '{"apiToken":"REPLACE_ME","baseUrl":""}'
  GithubSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ResourcePrefix}secret-github'
      Description: GitHub token + webhook HMAC secret
      SecretString: '{"token":"REPLACE_ME","webhookSecret":"REPLACE_ME"}'
  SlackBotSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ResourcePrefix}secret-slack-bot'
      Description: Slack incoming webhook URL / bot token
      SecretString: '{"webhookUrl":""}'
  TeamsWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ResourcePrefix}secret-teams-webhook'
      Description: Microsoft Teams incoming webhook URL
      SecretString: '{"webhookUrl":""}'

  OverlapThresholdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/app-193a359c-027ffd1c/overlap-threshold'
      Type: String
      Value: '0.75'
  SyncScheduleParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/app-193a359c-027ffd1c/sync-schedule'
      Type: String
      Value: 'rate(15 minutes)'
  FeatureFlagsParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/app-193a359c-027ffd1c/feature-flags'
      Type: String
      Value: '{"overlapNotifications":true,"smeRouting":true}'

  # ---------------------------------------------------------------------------
  # CloudWatch log groups (custom-named, 2yr retention)
  # ---------------------------------------------------------------------------
  CrudLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '${ResourcePrefix}lg-crud'
      RetentionInDays: !Ref LogRetentionDays
  SearchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '${ResourcePrefix}lg-search'
      RetentionInDays: !Ref LogRetentionDays
  ReviewPublishLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '${ResourcePrefix}lg-review-publish'
      RetentionInDays: !Ref LogRetentionDays
  IngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '${ResourcePrefix}lg-ingestion'
      RetentionInDays: !Ref LogRetentionDays
  OverlapEmbedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '${ResourcePrefix}lg-overlap-embed'
      RetentionInDays: !Ref LogRetentionDays
  OverlapClassifyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '${ResourcePrefix}lg-overlap-classify'
      RetentionInDays: !Ref LogRetentionDays
  SmeRouterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '${ResourcePrefix}lg-sme-router'
      RetentionInDays: !Ref LogRetentionDays
  NotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '${ResourcePrefix}lg-notifier'
      RetentionInDays: !Ref LogRetentionDays
  DashboardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '${ResourcePrefix}lg-dashboard'
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # IAM roles (all attach the mandatory permissions boundary)
  # ---------------------------------------------------------------------------
  CrudRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}role-fn-crud'
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: crud-inline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan, dynamodb:BatchGetItem]
                Resource:
                  - !GetAtt ProblemsTable.Arn
                  - !Sub '${ProblemsTable.Arn}/index/*'
                  - !GetAtt InitiativesTable.Arn
                  - !Sub '${InitiativesTable.Arn}/index/*'
                  - !GetAtt SolutionsTable.Arn
                  - !GetAtt FindingsTable.Arn
                  - !GetAtt AssetsTable.Arn
                  - !GetAtt SmeProfilesTable.Arn
                  - !GetAtt RelationshipsTable.Arn
                  - !Sub '${RelationshipsTable.Arn}/index/*'
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AuditLogTable.Arn
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt EventBus.Arn
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action: [s3vectors:PutVectors, s3vectors:QueryVectors, s3vectors:GetVectors, s3vectors:ListVectors, s3vectors:DeleteVectors, s3vectors:GetIndex, s3vectors:ListIndexes]
                Resource:
                  - !Sub 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ResourcePrefix}vectors'
                  - !Sub 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ResourcePrefix}vectors/*'

  SearchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}role-fn-search'
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: search-inline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:BatchGetItem]
                Resource:
                  - !GetAtt ProblemsTable.Arn
                  - !Sub '${ProblemsTable.Arn}/index/*'
                  - !GetAtt InitiativesTable.Arn
                  - !Sub '${InitiativesTable.Arn}/index/*'
                  - !GetAtt SolutionsTable.Arn
                  - !GetAtt FindingsTable.Arn
                  - !GetAtt AssetsTable.Arn
                  - !GetAtt SmeProfilesTable.Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AuditLogTable.Arn
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action: [s3vectors:QueryVectors, s3vectors:GetVectors, s3vectors:ListVectors]
                Resource:
                  - !Sub 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ResourcePrefix}vectors'
                  - !Sub 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ResourcePrefix}vectors/*'

  ReviewPublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}role-fn-review-publish'
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
