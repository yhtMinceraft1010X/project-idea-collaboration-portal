  # ---------------------------------------------------------------------------
  # Step Functions: overlap detection workflow
  # ---------------------------------------------------------------------------
  OverlapDetectionStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub '${ResourcePrefix}sfn-overlap-detection'
      Type: STANDARD
      Role: !GetAtt OverlapSfnRole.Arn
      Tracing:
        Enabled: true
      Definition:
        Comment: Embed a new initiative, search for similar active initiatives, classify overlaps, persist and notify.
        StartAt: EmbedAndSearch
        States:
          EmbedAndSearch:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt OverlapEmbedFn.Arn
              Payload.$: $
            ResultSelector:
              initiativeId.$: $.Payload.initiativeId
              candidates.$: $.Payload.candidates
            ResultPath: $.embed
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: NotifyOpsAndFail
            Next: Classify
          Classify:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt OverlapClassifyFn.Arn
              Payload:
                initiativeId.$: $.embed.initiativeId
                candidates.$: $.embed.candidates
            ResultSelector:
              results.$: $.Payload.results
            ResultPath: $.classify
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: NotifyOpsAndFail
            Next: Notify
          Notify:
            Type: Task
            Resource: arn:aws:states:::sns:publish
            Parameters:
              TopicArn: !Ref OverlapNotifyTopic
              Subject: Overlap detection results
              Message.$: States.JsonToString($.classify)
            End: true
          NotifyOpsAndFail:
            Type: Task
            Resource: arn:aws:states:::sns:publish
            Parameters:
              TopicArn: !Ref OpsAlertsTopic
              Subject: Overlap detection failed
              Message.$: States.JsonToString($.error)
            Next: FailState
          FailState:
            Type: Fail
            Error: OverlapDetectionFailed
            Cause: The overlap-detection workflow failed; see ops alerts.

