  IngestionConfluenceDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourcePrefix}alarm-ingestion-confluence-dlq'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt IngestionConfluenceDlq.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic
  IngestionGithubDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ResourcePrefix}alarm-ingestion-github-dlq'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt IngestionGithubDlq.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic

  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ResourcePrefix}dashboard-ops'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda errors",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${ResourcePrefix}fn-crud"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${ResourcePrefix}fn-search"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${ResourcePrefix}fn-ingestion"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${ResourcePrefix}fn-review-publish"]
                ],
                "stat": "Sum", "period": 300
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "DLQ depth",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ResourcePrefix}q-review-dlq"],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ResourcePrefix}q-ingestion-jira-dlq"],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ResourcePrefix}q-ingestion-github-dlq"]
                ],
                "stat": "Maximum", "period": 300
              }
            }
          ]
        }

Outputs:
  AppUrl:
    Description: Public application URL (CloudFront-hosted SPA).
    Value: !Sub 'https://${SpaDistribution.DomainName}'
  ApiUrl:
    Description: Base URL of the authenticated application REST API.
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod'
  WebhookApiUrl:
    Description: Base URL of the (unauthenticated, secret-validated) webhook API.
    Value: !Sub 'https://${WebhooksApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub 'https://${ResourcePrefix}auth.auth.${AWS::Region}.amazoncognito.com'
  SpaBucketName:
    Value: !Ref SpaAssetsBucket
  DistributionId:
    Value: !Ref SpaDistribution
  Region:
    Value: !Ref AWS::Region
